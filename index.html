<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Posicupos</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚢</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --side:#121A24; --side-2:#1A2431; --side-ink:#E6ECF3; --side-muted:#8C9AAD; --side-line:#243041;
  --bg:#EDF1F6; --surface:#FFFFFF; --surface-2:#F5F7FA; --ink:#16202C; --muted:#5A6678; --line:#D6DDE7; --line-2:#E6EBF1;
  --accent:#2F6FD0; --accent-soft:#E3ECFA; --accent-ink:#FFFFFF;
  --ok:#1E7A4C; --ok-soft:#E1F3E8; --warn:#9A5B00; --warn-soft:#FCF0DC; --bad:#B42318; --bad-soft:#FBE7E5;
  --feriado:#FFC000; --feriado-soft:#FFF1CC;
  --sw:236px;
  color-scheme:light; box-sizing:border-box;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --side:#0B1016; --side-2:#151D28; --side-ink:#E6ECF3; --side-muted:#7F8DA0; --side-line:#1E2835;
    --bg:#10151C; --surface:#18202A; --surface-2:#141B24; --ink:#E6ECF3; --muted:#98A5B6; --line:#2A3544; --line-2:#222C38;
    --accent:#6FA8F0; --accent-soft:#1C2B40; --accent-ink:#0C1520;
    --ok:#5CCB92; --ok-soft:#16301F; --warn:#F0B35E; --warn-soft:#352A17; --bad:#FF8A80; --bad-soft:#3A1C1A;
    --feriado:#E8A800; --feriado-soft:#3A2F12; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --side:#0B1016; --side-2:#151D28; --side-ink:#E6ECF3; --side-muted:#7F8DA0; --side-line:#1E2835;
  --bg:#10151C; --surface:#18202A; --surface-2:#141B24; --ink:#E6ECF3; --muted:#98A5B6; --line:#2A3544; --line-2:#222C38;
  --accent:#6FA8F0; --accent-soft:#1C2B40; --accent-ink:#0C1520;
  --ok:#5CCB92; --ok-soft:#16301F; --warn:#F0B35E; --warn-soft:#352A17; --bad:#FF8A80; --bad-soft:#3A1C1A;
  --feriado:#E8A800; --feriado-soft:#3A2F12; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{display:flex;background:var(--bg);color:var(--ink);font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

/* ---------- Barra lateral ---------- */
.side{position:sticky;top:0;height:100vh;flex:none;width:var(--sw);background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;
  padding:calc(14px + env(safe-area-inset-top,0px)) 10px calc(12px + env(safe-area-inset-bottom,0px));transition:width .22s ease;z-index:30;border-right:1px solid var(--side-line)}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;min-height:44px}
.logo{flex:none;width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#35A8E0,#1F5FA8);display:grid;place-items:center;font-size:17px}
.brand b{display:block;font-weight:800;font-size:1.05rem;letter-spacing:-.01em;white-space:nowrap}
.brand small{display:block;color:var(--side-muted);font-size:.7rem;font-weight:500;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.nav{display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto}
.sec{color:var(--side-muted);font-size:.68rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:12px 10px 6px;white-space:nowrap}
.item{position:relative;display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;border-radius:9px;padding:9px 10px;color:var(--side-muted);cursor:pointer;text-align:left;font-weight:500;white-space:nowrap;text-decoration:none}
.item:hover{background:var(--side-2);color:var(--side-ink)}
.item[aria-current="page"]{background:var(--side-2);color:var(--side-ink);font-weight:700}
.item[aria-current="page"]::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--c)}
.ico{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
.ico svg{width:16px;height:16px}
.item .lbl{overflow:hidden;text-overflow:ellipsis}
.foot{display:flex;align-items:center;gap:6px;padding-top:10px;border-top:1px solid var(--side-line);margin-top:8px}
.who{flex:1;min-width:0;font-size:.8rem;color:var(--side-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-left:6px}
.who b{color:var(--side-ink);font-weight:600}
.sbtn{flex:none;border:0;background:none;color:var(--side-muted);border-radius:8px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer}
.sbtn:hover{background:var(--side-2);color:var(--side-ink)}
.sbtn svg{width:18px;height:18px}
body.mini{--sw:68px}
body.mini .brand>div,body.mini .item .lbl,body.mini .sec,body.mini .who{display:none}
body.mini .brand{justify-content:center;padding-inline:0}
body.mini .item{justify-content:center;padding:8px 0}
body.mini .foot{flex-direction:column}
body.mini #collapse svg{transform:rotate(180deg)}

/* ---------- Contenido ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.mtop{display:none}
.head{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line-2);padding:14px 24px 12px}
.head-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.title{flex:1 1 240px;min-width:0}
.title h1{margin:0;font-size:1.55rem;font-weight:800;letter-spacing:-.025em;line-height:1.1}
.title p{margin:2px 0 0;color:var(--muted);font-size:.88rem}
.datebox{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.datebox input[type=date]{border:0;background:none;padding:6px 6px;font-weight:600;min-width:0;width:140px}
.datebox .wk{padding:4px 8px;font-weight:600;white-space:nowrap;cursor:pointer;border-radius:7px;position:relative}
.datebox .wk:hover{background:var(--surface-2)}
.datebox .wk small{display:block;color:var(--muted);font-weight:500;font-size:.74rem}
.datebox .wk input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.ib{border:0;background:none;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.ib:hover{background:var(--surface-2);color:var(--ink)}
.ib svg{width:17px;height:17px}
.ib.today{width:auto;padding:0 10px;font-size:.82rem;font-weight:600}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:8px 13px;font-weight:600;font-size:.9rem;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn svg{width:16px;height:16px;flex:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.small{padding:5px 10px;font-size:.84rem}
.btn.ghost{background:none;border-color:transparent}
.btn.ghost:hover{background:var(--surface);border-color:var(--line)}
.btn.danger{color:var(--bad)}
.btn.danger:hover{border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.status{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;color:var(--muted);white-space:nowrap;padding:0 4px}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--line)}
.status.ok::before{background:var(--ok)}
.status.busy::before{background:var(--warn)}
.status.err{color:var(--bad)}
.status.err::before{background:var(--bad)}
.menuwrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);min-width:250px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 40px -18px rgba(0,0,0,.45);padding:6px;z-index:40}
.menu button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;border-radius:8px;padding:9px 10px;text-align:left;cursor:pointer;font-size:.9rem}
.menu button:hover{background:var(--surface-2)}
.menu button svg{width:16px;height:16px;color:var(--muted);flex:none}
.menu hr{border:0;border-top:1px solid var(--line-2);margin:5px 4px}
.syncbar{display:flex;flex-direction:column;gap:6px;padding:0 24px}
.syncbar:not(:empty){padding-top:10px}
.sync{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:10px;padding:9px 12px;font-size:.9rem}
.sync.conflict{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.sync span{flex:1 1 260px}
.page{padding:18px 24px 80px;max-width:1500px;width:100%}

/* ---------- Tarjetas y campos ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:16px}
.card-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line-2)}
.card-b{padding:12px 14px}
.unit-tag{flex:none;font-weight:800;font-size:.72rem;letter-spacing:.06em;padding:4px 8px;border-radius:6px;background:var(--uc,#DEEBF7);color:#1B2633}
.in{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:7px 9px;width:100%;min-width:0;font-size:.92rem}
.in:hover{border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.in:focus{outline:none;border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.in.big{font-size:1.05rem;font-weight:700}
.in.bare{border-color:transparent;background:none}
.in.bare:hover{border-color:var(--line)}
.in.num{text-align:right;font-variant-numeric:tabular-nums}
textarea.in{resize:vertical;min-height:38px}
.fl{display:flex;flex-direction:column;gap:4px;min-width:0}
.fl>span{font-size:.74rem;font-weight:600;color:var(--muted);letter-spacing:.01em}
.grid{display:grid;gap:10px 12px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.multi{display:flex;flex-direction:column;gap:5px}
.multi .row{display:flex;gap:5px}
.addline{align-self:flex-start;border:0;background:none;color:var(--accent);font-size:.8rem;font-weight:600;cursor:pointer;padding:2px 2px}
.addline:hover{text-decoration:underline}
.x{flex:none;border:0;background:none;color:var(--muted);width:28px;border-radius:7px;cursor:pointer;font-size:1.05rem}
.x:hover{background:var(--bad-soft);color:var(--bad)}

/* Buques */
.vessel{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:var(--surface);overflow:hidden}
.vessel.hid{opacity:.62;border-style:dashed}
.vsum{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;min-height:56px}
.vsum:hover{background:var(--surface-2)}
.chev{flex:none;width:22px;height:22px;display:grid;place-items:center;color:var(--muted);transition:transform .15s}
.vessel.open .chev{transform:rotate(90deg)}
.vname{font-weight:800;font-size:1.02rem;letter-spacing:-.01em;min-width:120px}
.vname.empty{color:var(--muted);font-weight:600;font-style:italic}
.vmeta{flex:1;min-width:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:.85rem}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 9px;font-size:.78rem;font-weight:600;background:var(--surface-2);border:1px solid var(--line-2);color:var(--ink);white-space:nowrap;max-width:360px;overflow:hidden;text-overflow:ellipsis}
.chip.op{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.prod{border-color:transparent;background:color-mix(in srgb,var(--pc) 14%,transparent);color:var(--pc)}
.vtools{display:flex;gap:2px;flex:none}
.vbody{border-top:1px solid var(--line-2);padding:14px;display:flex;flex-direction:column;gap:14px;background:var(--surface)}
.vsec{display:flex;flex-direction:column;gap:8px}
.vsec>h4{margin:0;font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700}
.holds{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.holdsum{font-size:.82rem;color:var(--muted)}
.holdsum b{color:var(--ink)}
.holdsum.ok b{color:var(--ok)}
.holdsum.warn b{color:var(--warn)}
.add-vessel{width:100%;border:1.5px dashed var(--line);background:none;border-radius:12px;padding:11px;color:var(--accent);font-weight:600;cursor:pointer}
.add-vessel:hover{border-color:var(--accent);background:var(--accent-soft)}
.hidden-toggle{border:0;background:none;color:var(--muted);font-size:.84rem;cursor:pointer;padding:6px 2px;font-weight:600}
.hidden-toggle:hover{color:var(--ink)}
.empty-note{color:var(--muted);font-size:.9rem;padding:6px 2px 12px}

/* Tablas editables */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.et{border-collapse:separate;border-spacing:0;width:100%;font-size:.9rem}
table.et th{position:sticky;top:0;background:var(--surface-2);color:var(--muted);font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
table.et td{padding:4px 3px;border-bottom:1px solid var(--line-2);vertical-align:middle}
table.et tr:last-child td{border-bottom:0}
table.et .in{padding:6px 7px;font-size:.88rem;background:transparent;border-color:transparent}
table.et .in:hover{border-color:var(--line)}
table.et .in:focus{background:var(--surface);border-color:var(--accent)}
table.et th.n,table.et td.n{text-align:right}
table.et .ib{display:inline-grid;width:30px;height:30px}
table.et tfoot td{font-weight:700;background:var(--surface-2);padding:8px 6px;border-top:1px solid var(--line)}
.prodtxt{font-weight:700}

/* Cupos */
.days{display:grid;grid-template-columns:repeat(var(--nd),minmax(0,1fr));gap:8px;margin-bottom:16px}
.day{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:9px 11px;cursor:pointer;text-align:left;position:relative}
.day:hover{border-color:var(--feriado)}
.day b{display:block;font-size:.92rem}
.day small{color:var(--muted);font-size:.8rem}
.day .ftag{position:absolute;top:8px;right:9px;font-size:.66rem;font-weight:800;letter-spacing:.05em;color:#5B4300;background:var(--feriado);border-radius:5px;padding:1px 6px}
.day.fer{background:var(--feriado-soft);border-color:var(--feriado)}
.day.today{box-shadow:inset 0 0 0 2px var(--accent)}
.dayopts{display:flex;align-items:center;gap:16px;margin:-6px 0 16px;color:var(--muted);font-size:.85rem;flex-wrap:wrap}
.dayopts label{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.exgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,560px),1fr));gap:14px;align-items:start}
.exp .card-h .in{font-weight:800;font-size:1rem}
.exp .card-b{padding:6px 8px 10px}
.exp table.et td.fer,.exp table.et th.fer{background:var(--feriado-soft)}
.exp table.et .q{width:100%;text-align:right;font-variant-numeric:tabular-nums}
.exp table.et .q.zero{color:var(--muted)}
.exp.aparte{border-style:dashed}
.tag{font-size:.68rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;border-radius:5px;padding:2px 7px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line-2)}
.tag.ap{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.toggles{display:flex;gap:4px;margin-left:auto}
.inactivos{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:.88rem;margin:6px 0 18px}
.inactivos button{border:1px dashed var(--line);background:none;border-radius:99px;padding:4px 11px;font-size:.84rem;cursor:pointer;color:var(--ink)}
.inactivos button:hover{border-color:var(--accent);color:var(--accent)}
.summary table.et td{padding:7px 6px;font-variant-numeric:tabular-nums}
.summary .pdot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--pc);margin-right:7px}
.seclabel{display:flex;align-items:center;gap:10px;margin:22px 0 10px;font-size:.76rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.seclabel::after{content:"";flex:1;height:1px;background:var(--line)}

/* Listas */
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tagx{display:inline-flex;align-items:center;gap:2px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:99px;padding:2px 3px 2px 10px;font-size:.84rem;font-weight:600}
.tagx button{border:0;background:none;width:22px;height:22px;border-radius:50%;cursor:pointer;color:var(--muted)}
.tagx button:hover{background:var(--bad-soft);color:var(--bad)}
.lnote{color:var(--muted);font-size:.88rem;margin:0 0 16px;max-width:75ch}

/* Modal */
.modal{position:fixed;inset:0;z-index:60;background:rgba(8,12,18,.55);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:8vh 16px 16px;overflow-y:auto}
.mbox{width:min(520px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 30px 70px -25px rgba(0,0,0,.6);padding:20px;animation:pop .16s ease}
.mbox h2{margin:0 0 6px;font-size:1.2rem}
.mbox p{margin:0 0 12px;color:var(--muted)}
.mbox .opts{display:flex;flex-direction:column;gap:8px;margin:12px 0 16px}
.mbox .opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.mbox .opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.mbox .opt b{display:block}
.mbox .opt small{color:var(--muted)}
.mbtns{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.preview{position:fixed;inset:0;z-index:55;background:rgba(8,12,18,.6);display:flex;flex-direction:column}
.pbar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--side);color:var(--side-ink)}
.pbar b{flex:1}
.pscroll{flex:1;overflow:auto;padding:20px}
.ppaper{background:#fff;color:#000;margin:0 auto;box-shadow:0 10px 30px rgba(0,0,0,.35);padding:12mm;width:297mm;max-width:none}
.ppaper.portrait{width:210mm}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;font-size:.92rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:80;max-width:92vw}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* Login */
.login{position:fixed;inset:0;z-index:90;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
.lcard{width:min(380px,100%);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px 24px;box-shadow:0 30px 60px -30px rgba(0,0,0,.35)}
.lcard .lb{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.lcard .lb .logo{width:42px;height:42px;font-size:22px;border-radius:12px}
.lcard h2{margin:0;font-size:1.3rem}
.lcard .lb small{color:var(--muted)}
.lcard form{display:flex;flex-direction:column;gap:12px}
.lmsg{min-height:1.2em;font-size:.88rem;color:var(--bad)}

/* ---------- Hoja de impresión (estilo planilla) ---------- */
#printSheet{display:none}
.ps{font-family:Arial,Helvetica,sans-serif;color:#000;font-size:8.5px;line-height:1.2}
.ps .top{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.ps .top img{height:44px}
.ps .ttl{flex:1;background:#00B050;color:#fff;font-weight:800;font-size:20px;text-align:center;padding:8px;border:1px solid #000}
.ps .ttl.lg{background:#E2F0D9;color:#000}
.ps .dt{background:#00B050;color:#fff;font-weight:800;font-size:20px;padding:8px 16px;border:1px solid #000;white-space:nowrap}
.ps .dt.lg{background:#E2F0D9;color:#000}
.ps .unit{display:flex;align-items:stretch;gap:10px;margin:10px 0 4px;break-inside:avoid;break-after:avoid}
.ps .unit b{background:#DEEBF7;border:1px solid #000;font-size:17px;padding:4px 30px;min-width:260px;text-align:center}
.ps .unit span{border:1px solid #000;font-weight:700;font-size:10px;padding:4px 10px;display:flex;align-items:center;min-width:200px}
.ps table{border-collapse:collapse;width:100%}
.ps .vb{border:4px solid #00B0F0;border-top-width:2px;margin:0;break-inside:avoid}
.ps .vb+.vb{border-top:0}
.ps .vb td,.ps .vb th{border:1px solid #000;padding:2px 3px;text-align:center;vertical-align:middle;font-weight:700;white-space:pre-line}
.ps .vb th{background:#DAE3F3;font-size:8.5px}
.ps .vb th.ex{background:#E2F0D9}
.ps .vb td.name{font-size:9.5px}
.ps .vb td.estado.op{background:#E2EFDA;color:#375623}
.ps .vb td.obs2{text-align:left;font-size:7.5px;line-height:1.5}
.ps .vb .dims{display:flex;justify-content:space-between;margin-top:8px;font-size:7.5px}
.ps .vb tr.ft td{font-size:8px}
.ps .vt th{background:#FBE5D6;border:1px solid #000;font-style:italic;padding:5px 3px;font-size:8px}
.ps .vt td{border:1px solid #000;padding:6px 3px;text-align:center;font-style:italic}
.ps .vt td.tot{font-weight:800;font-size:10px}
.ps .cg{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;align-items:start}
.ps .cb{break-inside:avoid;border:3px solid #00B0F0}
.ps .cb td,.ps .cb th{border:1px solid #000;padding:2px 4px;text-align:center}
.ps .cb th{background:#C1E5F5}
.ps .cb th.n{background:#C2F1C8;font-style:italic;text-decoration:underline}
.ps .cb td.p{text-align:left}
.ps .cb tr.t td{font-weight:800}
.ps .cb .f{background:#FFC000!important}
.ps .ctitle{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.ps .ctitle b{background:#FBE3D6;font-style:italic;font-size:16px;padding:6px 20px}
.ps .ctitle span{background:#CAEEFB;font-weight:700;text-decoration:underline;padding:4px 10px}
.ps .rsec{font-size:11px;font-weight:800;margin:12px 0 5px;border-bottom:2px solid #00B0F0;padding-bottom:2px}
.ps .rt td,.ps .rt th{border:1px solid #888;padding:2px 4px;text-align:left}
.ps .rt th{background:#DAE3F3}
.ps .muted{color:#666;font-style:italic}

@media print{
  @page{size:A4 landscape;margin:8mm}
  body{display:block;background:#fff}
  body>*:not(#printSheet){display:none!important}
  #printSheet{display:block!important}
}

/* ---------- Celular ---------- */
.scrim{display:none}
@media (max-width:860px){
  body{display:block}
  body.mini{--sw:236px}
  .side{position:fixed;inset:0 auto 0 0;transform:translateX(-100%);transition:transform .22s ease;box-shadow:0 0 40px rgba(0,0,0,.4)}
  body.open .side{transform:none}
  body.mini .brand>div,body.mini .item .lbl,body.mini .sec,body.mini .who{display:revert}
  body.mini .item{justify-content:flex-start;padding:9px 10px}
  #collapse{display:none}
  .scrim{display:block;position:fixed;inset:0;background:rgba(8,12,18,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:25}
  body.open .scrim{opacity:1;pointer-events:auto}
  .mtop{display:flex;align-items:center;gap:8px;background:var(--side);color:var(--side-ink);padding:calc(6px + env(safe-area-inset-top,0px)) 8px 6px;position:sticky;top:0;z-index:22}
  .mtop .sbtn{color:var(--side-ink)}
  .mtop b{flex:1}
  .head{position:static;padding:14px 14px 10px}
  .page{padding:14px 14px 70px}
  .syncbar{padding:0 14px}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:minmax(0,1fr)}
  .holds{grid-template-columns:repeat(4,minmax(0,1fr))}
  .days{grid-template-columns:repeat(3,minmax(0,1fr))}
  .btn .t{display:none}
  .vsum{flex-wrap:wrap;row-gap:6px}
  .vname{flex:1;min-width:0}
  .vmeta{order:3;flex-basis:100%;padding-left:32px}
  .exgrid{grid-template-columns:minmax(0,1fr)}
  .datebox input[type=date]{width:128px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

const store = {
  async get(key){
    const s = await db.collection(COL).doc(key).get();
    return s.exists ? s.data().value : null;
  },
  async set(key, value){ await db.collection(COL).doc(key).set({ value, updatedAt: Date.now() }); },
  async list(prefix){
    const snap = await db.collection(COL).orderBy(firebase.firestore.FieldPath.documentId()).startAt(prefix).endAt(prefix + "").get();
    return snap.docs.map(d => d.id);
  },
  watch(key, cb){
    return db.collection(COL).doc(key).onSnapshot(s => {
      if (s.metadata.hasPendingWrites) return;
      cb(s.exists ? s.data().value : null);
    }, err => console.error("watch", key, err));
  }
};

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const nrm = s => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").toUpperCase().replace(/\s+/g, " ").trim();
const trim = s => String(s ?? "").trim();
const lines = s => String(s ?? "").split("\n").map(x => x.trim()).filter(Boolean);
const uid = () => "x" + Math.random().toString(36).slice(2, 10);
function num(v){
  if (typeof v === "number") return v;
  let s = String(v ?? "").trim().replace(/\s/g, "");
  if (!s) return 0;
  if (/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) s = s.replace(/\./g, "").replace(",", ".");
  else if (/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) s = s.replace(/,/g, "");
  else s = s.replace(",", ".");
  const n = parseFloat(s);
  return isFinite(n) ? n : 0;
}
const fmtN = (n, d = 0) => Number(n || 0).toLocaleString("es-AR", { minimumFractionDigits: d, maximumFractionDigits: d });
const pad = n => String(n).padStart(2, "0");
const isoOf = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const todayISO = () => isoOf(new Date());
const dOf = iso => { const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (iso, n) => { const d = dOf(iso); d.setDate(d.getDate() + n); return isoOf(d); };
const fmtD = iso => { if (!iso) return ""; const [y, m, d] = iso.split("-"); return d + "/" + m + "/" + y; };
const fmtDs = iso => { if (!iso) return ""; const [, m, d] = iso.split("-"); return d + "/" + m; };
const mondayOf = iso => { const d = dOf(iso); const w = d.getDay(); d.setDate(d.getDate() + (w === 0 ? -6 : 1 - w)); return isoOf(d); };

// Semana como en el CUADRO CUPOS: la semana 1 arranca el primer lunes del año
function semanaNro(mondayIso){
  const d = dOf(mondayIso);
  const f = new Date(d.getFullYear(), 0, 1);
  while (f.getDay() !== 1) f.setDate(f.getDate() + 1);
  return Math.floor(Math.round((d - f) / 86400000) / 7) + 1;
}

function prodColor(s){ const n = nrm(s); for (const k in PROD_COLORS) if (n.includes(k)) return PROD_COLORS[k]; return null; }
function prodKey(s){ const n = nrm(s).replace(/[^A-Z0-9 ]/g, " ").trim(); for (const k in PROD_COLORS) if (n.includes(k)) return k; return n.split(" ")[0] || n; }

function loadScript(src){
  return new Promise((ok, bad) => {
    if (document.querySelector(`script[src="${src}"]`)) return ok();
    const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => bad(new Error("no se pudo cargar " + src)); document.head.appendChild(s);
  });
}

function fixBuques(o, date){
  o = o && typeof o === "object" ? o : {};
  o.date = date;
  if (!Array.isArray(o.units) || !o.units.length) o.units = [newUnit("UNIDAD 6"), newUnit("UNIDAD 7")];
  o.units.forEach(u => {
    u.id = u.id || uid(); u.name = u.name ?? ""; u.note = u.note ?? "";
    u.vessels = (u.vessels || []).map(v => {
      const n = Object.assign(newVessel(), v);
      n.id = v.id || uid();
      n.holds = Array.from({ length:HOLDS }, (_, i) => (v.holds && v.holds[i]) || "");
      delete n.collapsed;
      return n;
    }).filter(v => !isEmptyVessel(v)); // los buques vacíos que dejaba la app vieja no se muestran
  });
  return o;
}
function isEmptyVessel(v){
  return !["buque","estado","planoCarga","observaciones1","cargadores","declaracion","mercaderia","surveyor","agencia","destino","procedencia","eslora","manga","puntal","draft","fumiga","coordina"].some(k => trim(v[k])) && !v.holds.some(h => trim(h));
}
function fixVagones(o, date){
  o = o && typeof o === "object" ? o : {};
  o.date = date;
  o.rows = (o.rows || []).map(r => Object.assign(newWagon(), r, { id: r.id || uid() }))
    .filter(r => WAGON_COLS.some(c => trim(r[c.key])));
  return o;
}
function fixCupos(o, week){
  o = o && typeof o === "object" ? o : {};
  o.weekStart = week;
  o.exportadores = (o.exportadores || []).map(e => {
    const n = Object.assign(newExp(), e, { id: e.id || uid() });
    n.products = (e.products || []).map(p => Object.assign(newProduct(), p, {
      id: p.id || uid(), values: Array.from({ length:7 }, (_, i) => (p.values && p.values[i] != null) ? String(p.values[i]) : "")
    }));
    if (!n.products.length) n.products = [newProduct()];
    return n;
  }).filter(e => trim(e.name) || e.products.some(p => trim(p.name) || p.values.some(v => trim(v))));
  o.feriados = Array.from({ length:7 }, (_, i) => !!(o.feriados && o.feriados[i]));
  o.domingo = !!o.domingo || o.exportadores.some(e => e.products.some(p => num(p.values[6])));
  return o;
}

function listValues(k){
  const base = (S.listas && S.listas[k]) || DEFAULT_LISTAS[k] || [];
  const seen = new Map(); const add = v => { v = trim(v); if (v && !seen.has(nrm(v))) seen.set(nrm(v), v); };
  base.forEach(add);
  const B = S.buques, V = S.vagones, C = S.cupos;
  const fromV = f => B && B.units.forEach(u => u.vessels.forEach(v => lines(v[f]).forEach(add)));
  if (k === "estado") fromV("estado");
  if (k === "mercaderia"){ fromV("mercaderia"); V && V.rows.forEach(r => add(r.producto)); C && C.exportadores.forEach(e => e.products.forEach(p => add(p.name))); }
  if (k === "cargador"){ fromV("cargadores"); V && V.rows.forEach(r => add(r.destinatario)); }
  if (k === "surveyor") fromV("surveyor");
  if (k === "agencia") fromV("agencia");
  if (k === "destino") fromV("destino");
  if (k === "procedencia") fromV("procedencia");
  if (k === "exportador") C && C.exportadores.forEach(e => add(e.name));
  const vmap = { ffcc:"ffcc", vdestino:"destino", entregador:"entregador", remitente:"remitente", vprocedencia:"procedencia", situacion:"situacion", ubicacion:"observaciones" };
  if (vmap[k]) V && V.rows.forEach(r => add(r[vmap[k]]));
  return [...seen.values()];
}

// Vuelve a dibujar la sección sin perder el campo donde estabas escribiendo
function rerender(focusSel){
  const a = document.activeElement;
  const key = a && a.dataset && a.dataset.o ? { o:a.dataset.o, f:a.dataset.f, i:a.dataset.i, l:a.dataset.l, s:a.selectionStart } : null;
  const y = window.scrollY;
  render();
  window.scrollTo(0, y);
  let el = null;
  if (focusSel) el = document.querySelector(focusSel);
  else if (key){
    el = [...document.querySelectorAll(`[data-o="${key.o}"][data-f="${key.f}"]`)].find(x => x.dataset.i === key.i && x.dataset.l === key.l);
  }
  if (el){ el.focus({ preventScroll:true }); try{ if (key && key.s != null && !focusSel) el.setSelectionRange(key.s, key.s); }catch(e){} }
}

/* ---------- Edición en los campos ---------- */
function onField(e){
  const el = e.target, o = REG.get(el.dataset.o);
  if (!o || !el.dataset.f) return;
  const f = el.dataset.f;
  const val = el.type === "checkbox" ? el.checked : el.value;
  if (el.dataset.i != null) o[f][+el.dataset.i] = val;
  else if (el.dataset.l != null){ const ls = String(o[f] ?? "").split("\n"); ls[+el.dataset.l] = val; o[f] = ls.join("\n"); }
  else o[f] = val;
  if (S.sec === "buques"){ refreshVessel(el.closest("[data-vid]")); }
  if (S.sec === "vagones") refreshVagones();
  if (S.sec === "cupos") refreshCupos(el);
  scheduleSave(S.sec);
}

/* ---------- Guardado y sincronización en vivo ---------- */
const SYNC = ["buques", "vagones", "cupos"];
const pending = new Set();
const lastSaved = { buques:null, vagones:null, cupos:null };
const queued = { buques:null, vagones:null, cupos:null };
const watchers = {};
let saveT = null;
const keyOf = t => t === "buques" ? keyB(S.date) : t === "vagones" ? keyV(S.date) : keyC(S.week);
const stateOf = t => S[t];
const clean = t => {
  const st = S[t];
  if (t === "buques") return { date:st.date, units:st.units.map(u => ({ ...u, vessels:u.vessels.filter(v => !isEmptyVessel(v)) })) };
  if (t === "vagones") return { date:st.date, rows:st.rows.filter(r => WAGON_COLS.some(c => trim(r[c.key]))) };
  return st;
};
function scheduleSave(t){
  if (!SYNC.includes(t)) return;
  pending.add(t);
  setStatus("Editando…", "busy");
  clearTimeout(saveT);
  saveT = setTimeout(flush, 700);
  updateSyncBar();
}
async function flush(){
  clearTimeout(saveT); saveT = null;
  const ts = [...pending].filter(t => !queued[t]);
  if (!ts.length){ updateSyncBar(); return; }
  ts.forEach(t => pending.delete(t));
  setStatus("Guardando…", "busy");
  try{
    for (const t of ts){
      const st = stateOf(t);
      const key = t === "buques" ? keyB(st.date) : t === "vagones" ? keyV(st.date) : keyC(st.weekStart);
      const value = JSON.stringify(clean(t));
      lastSaved[t] = value;
      await store.set(key, value);
    }
    setStatus("Guardado", "ok");
  }catch(e){
    console.error(e);
    ts.forEach(t => pending.add(t));
    setStatus("No se pudo guardar", "err");
    toast("No se pudo guardar. Revisá la conexión; se vuelve a intentar al seguir editando.");
  }
  updateSyncBar();
}
window.addEventListener("pagehide", () => { flush(); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flush(); });
window.addEventListener("beforeunload", e => { if (pending.size){ flush(); e.preventDefault(); e.returnValue = ""; } });

function isEditing(){ const a = document.activeElement; return !!(a && $("page").contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)); }
function applyRemote(t){
  const raw = queued[t]; queued[t] = null;
  if (raw){
    let o = null; try{ o = JSON.parse(raw); }catch(e){}
    if (o){
      lastSaved[t] = raw;
      if (t === "buques") S.buques = fixBuques(o, S.date);
      else if (t === "vagones") S.vagones = fixVagones(o, S.date);
      else S.cupos = fixCupos(o, S.week);
      if (S.sec === t || S.sec === "resumen") rerender();
      setStatus("Actualizado con cambios de otra persona", "ok");
    }
  }
  updateSyncBar();
}
function tryApply(t){
  if (!queued[t]) return;
  if (pending.has(t) || (S.sec === t && isEditing())){ updateSyncBar(); return; }
  applyRemote(t);
}
function watch(t){
  if (watchers[t]) watchers[t]();
  queued[t] = null;
  const key = keyOf(t);
  watchers[t] = store.watch(key, value => {
    if (key !== keyOf(t) || value === null) return;
    if (value === lastSaved[t]) return;
    if (value === JSON.stringify(clean(t))) return;
    queued[t] = value;
    tryApply(t);
  });
}
function okToLeave(ts){
  const stuck = ts.filter(t => queued[t] && pending.has(t));
  if (!stuck.length) return true;
  if (!confirm("Hay cambios tuyos sin guardar en " + stuck.map(t => SECTIONS[t].name).join(" y ") + " porque otra persona también editó. Si cambiás de fecha se pierden. ¿Cambiar igual?")) return false;
  stuck.forEach(t => { pending.delete(t); queued[t] = null; });
  return true;
}
function updateSyncBar(){
  const bar = $("syncbar"); bar.innerHTML = "";
  SYNC.forEach(t => {
    if (!queued[t]) return;
    const conflict = pending.has(t);
    const d = document.createElement("div");
    d.className = "sync" + (conflict ? " conflict" : "");
    d.innerHTML = conflict
      ? `<span>⚠ Otra persona guardó cambios en <b>${SECTIONS[t].name}</b> mientras vos también editabas. Lo tuyo todavía no se guardó.</span>
         <button class="btn small" type="button" data-act="theirs" data-t="${t}">Ver lo de la otra persona</button>
         <button class="btn small primary" type="button" data-act="mine" data-t="${t}">Guardar lo mío</button>`
      : `<span>Hay cambios nuevos de otra persona en <b>${SECTIONS[t].name}</b>. Se aplican cuando termines de escribir.</span>
         <button class="btn small" type="button" data-act="applyNow" data-t="${t}">Actualizar ahora</button>`;
    bar.appendChild(d);
  });
}
document.addEventListener("focusout", () => setTimeout(() => SYNC.forEach(tryApply), 0));

/* ---------- Carga de datos ---------- */
async function loadJSON(key){ const v = await store.get(key); if (!v) return null; try{ return JSON.parse(v); }catch(e){ return null; } }
async function loadDay(date){
  const [b, v] = await Promise.all([loadJSON(keyB(date)), loadJSON(keyV(date))]);
  S.date = date;
  S.buques = fixBuques(b, date); lastSaved.buques = b ? JSON.stringify(clean("buques")) : null;
  S.vagones = fixVagones(v, date); lastSaved.vagones = v ? JSON.stringify(clean("vagones")) : null;
  watch("buques"); watch("vagones");
  S.resumenCupos = null;
}
async function loadWeek(week){
  const c = await loadJSON(keyC(week));
  S.week = week;
  S.cupos = fixCupos(c, week); lastSaved.cupos = c ? JSON.stringify(S.cupos) : null;
  watch("cupos");
}
async function setDate(date){
  if (!date || date === S.date) return;
  if (!okToLeave(["buques", "vagones"])) return renderHead();
  await flush();
  setStatus("Cargando…", "busy");
  await loadDay(date);
  if (S.sec === "resumen") await ensureResumenCupos();
  setStatus("Al día", "ok");
  render();
}
async function setWeek(week){
  week = mondayOf(week);
  if (week === S.week) return;
  if (!okToLeave(["cupos"])) return renderHead();
  await flush();
  setStatus("Cargando…", "busy");
  await loadWeek(week);
  setStatus("Al día", "ok");
  render();
}
async function ensureResumenCupos(){
  const w = mondayOf(S.date);
  if (w === S.week){ S.resumenCupos = null; return; }
  if (S.resumenCupos && S.resumenCupos.weekStart === w) return;
  S.resumenCupos = fixCupos(await loadJSON(keyC(w)), w);
}
function countVessels(){ return S.buques.units.reduce((n, u) => n + u.vessels.filter(v => !v.oculto).length, 0); }
function totalTons(){ return S.vagones.rows.reduce((s, r) => s + num(r.toneladas), 0); }

const ACT_B = {
  toggleV(el){ const id = el.dataset.v; S.open.has(id) ? S.open.delete(id) : S.open.add(id); rerender(); },
  addVessel(el){
    const u = REG.get(el.dataset.u); const v = newVessel();
    u.vessels.push(v); S.open.add(v.id);
    rerender(`[data-o="${v.id}"][data-f="buque"]`);
  },
  delVessel(el){
    const u = unitOfVessel(el.dataset.v), v = REG.get(el.dataset.v);
    if (!isEmptyVessel(v) && !confirm(`¿Eliminar el buque ${trim(v.buque) || "sin nombre"}? Si solo querés que no salga en la planilla, usá Ocultar.`)) return;
    u.vessels = u.vessels.filter(x => x.id !== v.id); scheduleSave("buques"); rerender();
  },
  hide(el){ const v = REG.get(el.dataset.v); v.oculto = true; S.open.delete(v.id); scheduleSave("buques"); rerender(); toast(`${trim(v.buque) || "El buque"} quedó oculto. Está abajo de todo en su unidad.`); },
  unhide(el){ const v = REG.get(el.dataset.v); v.oculto = false; scheduleSave("buques"); rerender(); },
  toggleHidden(el){ S.showHidden[el.dataset.u] = !S.showHidden[el.dataset.u]; rerender(); },
  move(el){
    const u = unitOfVessel(el.dataset.v), d = +el.dataset.n;
    const vis = u.vessels.filter(v => !v.oculto);
    const i = vis.findIndex(v => v.id === el.dataset.v), j = i + d;
    if (j < 0 || j >= vis.length) return;
    const a = u.vessels.indexOf(vis[i]), b = u.vessels.indexOf(vis[j]);
    [u.vessels[a], u.vessels[b]] = [u.vessels[b], u.vessels[a]];

  },
  addLine(el){
    const o = REG.get(el.dataset.v), f = el.dataset.f, ls = String(o[f] ?? "").split("\n");
    const empty = ls.findIndex(x => !trim(x));
    if (empty >= 0) return rerender(`[data-o="${o.id}"][data-f="${f}"][data-l="${empty}"]`);
    o[f] = ls.join("\n") + "\n"; rerender(`[data-o="${o.id}"][data-f="${f}"][data-l="${ls.length}"]`);
  },
  delLine(el){ const o = REG.get(el.dataset.v); const f = el.dataset.f; const ls = String(o[f] ?? "").split("\n"); ls.splice(+el.dataset.l, 1); o[f] = ls.join("\n"); scheduleSave(S.sec); rerender(); },

  delUnit(el){
    const u = REG.get(el.dataset.u);
    if (!confirm(`¿Eliminar ${u.name || "la unidad"}${u.vessels.length ? " y sus " + u.vessels.length + " buque(s)" : ""}?`)) return;
    S.buques.units = S.buques.units.filter(x => x !== u); scheduleSave("buques"); rerender();
  },
};

const nDays = C => C.domingo ? 7 : 6;
const expActive = C => C.exportadores.filter(e => !e.inactivo);
function expTotals(e, nd){ const t = Array(nd).fill(0); e.products.forEach(p => { for (let i = 0; i < nd; i++) t[i] += num(p.values[i]); }); return t; }
// Suma por producto (como el bloque "CAMIONES X PRODUCTOS")
function prodAgg(C){
  const nd = nDays(C), map = new Map();
  expActive(C).filter(e => !e.aparte).forEach(e => e.products.forEach(p => {
    if (!trim(p.name) && p.values.every(v => !num(v))) return;
    const k = prodKey(p.name) || "SIN PRODUCTO";
    if (!map.has(k)) map.set(k, { label:k, t:Array(nd).fill(0) });
    for (let i = 0; i < nd; i++) map.get(k).t[i] += num(p.values[i]);
  }));
  return [...map.values()];
}

    <div class="card-h">
      <input class="in bare" style="flex:1 1 160px" data-o="${e.id}" data-f="name" value="${esc(e.name)}" list="dl-exportador" placeholder="Exportador" autocomplete="off" aria-label="Exportador">
      ${e.aparte ? `<span class="tag ap">Aparte</span>` : ""}
      <span class="toggles">
        ${n > 1 ? `<button class="ib" type="button" data-act="moveE" data-e="${e.id}" data-n="-1" title="Subir" ${i === 0 ? "disabled" : ""}>${svg("up")}</button><button class="ib" type="button" data-act="moveE" data-e="${e.id}" data-n="1" title="Bajar" ${i === n - 1 ? "disabled" : ""}>${svg("down")}</button>` : ""}
        <button class="ib" type="button" data-act="aparte" data-e="${e.id}" title="${e.aparte ? "Que vuelva a sumar en el resumen" : "Poner aparte (no suma en el resumen, como PTO ARROYO)"}">${svg("split")}</button>
        <button class="ib" type="button" data-act="inactivar" data-e="${e.id}" title="Sin cupos esta semana (se guarda para después)">${svg("pause")}</button>
        <button class="ib" type="button" data-act="delExp" data-e="${e.id}" title="Eliminar exportador">${svg("trash")}</button>
      </span>
    </div>
    <div class="card-b"><div class="tw"><table class="et">
      <thead><tr><th>Producto</th>${Array.from({ length:nd }, (_, d) => `<th class="n${fer[d] ? " fer" : ""}" title="${fmtD(addDays(C.weekStart, d))}">${DIAS_C[d]} ${fmtDs(addDays(C.weekStart, d)).slice(0, 2)}</th>`).join("")}<th class="n">Total</th><th>Nota</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr><td style="text-align:right">Totales</td>${tot.map((t, d) => `<td class="n${fer[d] ? " fer" : ""}" id="ct-${e.id}-${d}">${fmtN(t)}</td>`).join("")}<td class="n" id="ct-${e.id}-t">${fmtN(tot.reduce((a, b) => a + b, 0))}</td><td colspan="2"></td></tr></tfoot>
    </table></div>
    <button class="addline" type="button" data-act="addProd" data-e="${e.id}" style="margin:6px 4px 0">+ Producto</button></div>

}
function summaryHTML(C){
  const nd = nDays(C), agg = prodAgg(C), fer = C.feriados;
  if (!agg.length) return `<div class="card"><div class="card-b empty-note">Cuando cargues cupos, acá se suman por producto y por día.</div></div>`;
  const tot = Array(nd).fill(0); agg.forEach(a => a.t.forEach((x, i) => tot[i] += x));
  const exps = expActive(C).filter(e => !e.aparte && trim(e.name));
  const head = `<tr><th></th>${Array.from({ length:nd }, (_, d) => `<th class="n${fer[d] ? " fer" : ""}">${DIAS_C[d]} ${fmtDs(addDays(C.weekStart, d)).slice(0, 2)}</th>`).join("")}<th class="n">Semana</th></tr>`;
  const row = (lbl, t, dot) => `<tr><td>${dot ? `<span class="pdot" style="--pc:${dot}"></span>` : ""}<b>${esc(lbl)}</b></td>${t.map((x, d) => `<td class="n${fer[d] ? " fer" : ""}">${fmtN(x)}</td>`).join("")}<td class="n"><b>${fmtN(t.reduce((a, b) => a + b, 0))}</b></td></tr>`;
  return `<div class="exgrid summary">
    <section class="card exp"><div class="card-h"><b>Camiones por producto</b></div><div class="card-b"><div class="tw"><table class="et">
      <thead>${head}</thead><tbody>${agg.map(a => row(a.label, a.t, prodColor(a.label) || "var(--muted)")).join("")}</tbody>
      <tfoot>${row("Totales", tot).replace(/<b>/g, "").replace(/<\/b>/g, "")}</tfoot></table></div></div></section>
    <section class="card exp"><div class="card-h"><b>Camiones por exportador</b></div><div class="card-b"><div class="tw"><table class="et">
      <thead>${head}</thead><tbody>${exps.map(e => row(e.name, expTotals(e, nd))).join("")}</tbody></table></div></div></section>
  </div>`;
}
function refreshCupos(el){
  const C = S.cupos, nd = nDays(C);
  const box = el.closest("[data-eid]");
  if (el.classList.contains("q")) el.classList.toggle("zero", !num(el.value));
  if (el.dataset.f === "name" && el.classList.contains("prodtxt")) el.style.color = prodColor(el.value) || "";
  if (box){
    const e = REG.get(box.dataset.eid);
    if (e){
      const t = expTotals(e, nd);
      t.forEach((x, d) => { const c = $(`ct-${e.id}-${d}`); if (c) c.textContent = fmtN(x); });
      const ct = $(`ct-${e.id}-t`); if (ct) ct.textContent = fmtN(t.reduce((a, b) => a + b, 0));
      const p = REG.get(el.dataset.o);
      if (p && p.values){ const rt = $("rt-" + p.id); if (rt) rt.textContent = fmtN(p.values.slice(0, nd).reduce((a, v) => a + num(v), 0)); }
    }
  }
  const s = $("cupSummary"); if (s) s.innerHTML = summaryHTML(C);
}
const expById = id => S.cupos.exportadores.find(e => e.id === id);
const ACT_C = {
  feriado(el){ const i = +el.dataset.i; S.cupos.feriados[i] = !S.cupos.feriados[i]; scheduleSave("cupos"); rerender(); },
  domingo(el){ S.cupos.domingo = el.checked; scheduleSave("cupos"); rerender(); },
  addExp(){ const e = newExp(""); S.cupos.exportadores.push(e); scheduleSave("cupos"); rerender(`[data-o="${e.id}"][data-f="name"]`); },
  delExp(el){
    const e = expById(el.dataset.e);
    if (!confirm(`¿Eliminar ${trim(e.name) || "este exportador"} de esta semana? Si solo no tiene cupos, usá la pausa y queda guardado.`)) return;
    S.cupos.exportadores = S.cupos.exportadores.filter(x => x !== e); scheduleSave("cupos"); rerender();
  },
  inactivar(el){ const e = expById(el.dataset.e); e.inactivo = true; scheduleSave("cupos"); rerender(); toast(`${trim(e.name) || "El exportador"} quedó en pausa. Lo volvés a activar desde "Sin cupos esta semana".`); },
  activar(el){ const e = expById(el.dataset.e); e.inactivo = false; scheduleSave("cupos"); rerender(); },
  aparte(el){ const e = expById(el.dataset.e); e.aparte = !e.aparte; scheduleSave("cupos"); rerender(); },
  moveE(el){
    const e = expById(el.dataset.e), all = S.cupos.exportadores;
    const grp = expActive(S.cupos).filter(x => x.aparte === e.aparte);
    const i = grp.indexOf(e), j = i + +el.dataset.n; if (j < 0 || j >= grp.length) return;
    const a = all.indexOf(grp[i]), b = all.indexOf(grp[j]); [all[a], all[b]] = [all[b], all[a]];
    scheduleSave("cupos"); rerender();
  },
  addProd(el){ const e = expById(el.dataset.e); const p = newProduct(); e.products.push(p); scheduleSave("cupos"); rerender(`[data-o="${p.id}"][data-f="name"]`); },
  delProd(el){
    const e = expById(el.dataset.e); const p = e.products.find(x => x.id === el.dataset.p);
    if (p.values.some(v => num(v)) && !confirm(`¿Quitar ${trim(p.name) || "este producto"}?`)) return;
    e.products = e.products.filter(x => x !== p); if (!e.products.length) e.products.push(newProduct());
    scheduleSave("cupos"); rerender();
  },
};

/* =================== HOJAS PARA PDF / IMPRIMIR =================== */
const LOGO_SRC = "data:image/jpeg;base64," + LOGO_B64;
const visVessels = u => u.vessels.filter(v => !v.oculto && !isEmptyVessel(v));
const dashed = s => esc(s).replace(/\n/g, "<br>");
const fechaLarga = iso => { const d = dOf(iso); return WEEKDAY[d.getDay()].slice(0, 3) + " " + fmtD(iso); };

function psBuques(B){
  let h = `<div class="ps"><div class="top"><img src="${LOGO_SRC}" alt=""><div class="ttl">POSICIÓN DE BUQUES · SPSA ROSARIO</div><div class="dt">${fechaLarga(B.date)}</div></div>`;
  B.units.forEach((u, ui) => {
    const vs = visVessels(u);
    h += `<div class="unit"><b style="background:${unitColor(u, ui)}">${esc(u.name)}</b>${trim(u.note) ? `<span>${esc(u.note)}</span>` : ""}</div>`;
    (vs.length ? vs : [null]).forEach(v => { h += psVessel(v || newVessel()); });
  });
  return h + `</div>`;
}
function psVessel(v){
  const L = f => lines(v[f]).map(esc).join("<br>");
  const merc = lines(v.mercaderia).map(m => `<span style="color:${prodColor(m) || "#000"}">${esc(m)}</span>`).join("<br>");
  const dims = [v.eslora, v.manga, v.puntal].map(x => `<span>${esc(x)}</span>`).join("");
  const hold = i => `# ${i + 1} - ${esc(v.holds[i] || "")}`;
  return `<table class="vb"><colgroup><col style="width:9%"><col style="width:16%"><col style="width:6.5%"><col style="width:12%"><col style="width:7%"><col style="width:7.5%"><col style="width:6%"><col style="width:8%"><col style="width:8%"><col style="width:9%"><col style="width:11%"></colgroup>
    <tr><th>Buque</th><th class="ex">Estado · ${esc(v.tipo || "Exportación")}</th><th>Plano de carga</th><th>Observaciones</th><th>Cargador/es</th><th>Declaración</th><th>Mercadería</th><th>Surveyor</th><th>Agencia</th><th>Destino</th><th>Observaciones</th></tr>
    <tr style="height:64px"><td class="name">${esc(v.buque)}<div class="dims">${dims}</div></td><td class="estado${esOperando(v.estado) ? " op" : ""}">${esc(v.estado)}</td><td>${esc(v.planoCarga)}</td><td>${dashed(v.observaciones1)}</td><td>${L("cargadores")}</td><td>${esc(v.declaracion)}</td><td>${merc}</td><td>${L("surveyor")}</td><td>${L("agencia")}</td><td>${esc(v.destino)}</td>
      <td class="obs2">DRAFT: ${esc(v.draft)}<br>FUMIGA: ${esc(v.fumiga)}<br>COORDINA: ${esc(v.coordina)}</td></tr>
    <tr class="ft"><td style="padding:0"><div class="dims" style="margin:0;padding:2px 3px"><span>Eslora</span><span>Manga</span><span>Puntal</span></div></td><td>Procedencia: ${esc(v.procedencia)}</td>${[0,1,2,3,4,5,6].map(i => `<td>${hold(i)}</td>`).join("")}<td></td><td></td></tr>
  </table>`;
}
function psVagones(V){
  const rows = V.rows.filter(r => WAGON_COLS.some(c => trim(r[c.key])));
  let h = `<div class="ps"><div class="top"><img src="${LOGO_SRC}" alt=""><div class="ttl lg">POSICIÓN DE VAGONES</div><div class="dt lg">${fmtD(V.date)}</div></div>
    <table class="vt"><tr>${WAGON_COLS.map(c => `<th>${esc(c.label.toUpperCase())}</th>`).join("")}</tr>`;
  if (!rows.length) h += `<tr><td colspan="${WAGON_COLS.length}" class="muted">Sin vagones cargados.</td></tr>`;
  rows.forEach(r => { h += `<tr>${WAGON_COLS.map(c => `<td${c.key === "producto" ? ` style="font-weight:700;color:${prodColor(r.producto) || "#000"}"` : ""}>${esc(r[c.key])}</td>`).join("")}</tr>`; });
  h += `<tr><td colspan="6" style="border:0"></td><td class="tot">TOTAL TONS.</td><td class="tot">${fmtN(rows.reduce((s, r) => s + num(r.toneladas), 0))}</td><td colspan="4" style="border:0"></td></tr></table></div>`;
  return h;
}
function psCupos(C){
  const nd = nDays(C), act = expActive(C), main = act.filter(e => !e.aparte), ap = act.filter(e => e.aparte), fer = C.feriados;
  const dhead = `${Array.from({ length:nd }, (_, d) => `<th class="${fer[d] ? "f" : ""}">${DIAS[d]}</th>`).join("")}`;
  const ddate = `${Array.from({ length:nd }, (_, d) => `<th class="${fer[d] ? "f" : ""}">${fmtDs(addDays(C.weekStart, d))}</th>`).join("")}`;
  const block = e => {
    const t = expTotals(e, nd);
    return `<table class="cb"><tr><th class="n">${esc(e.name)}</th>${dhead}</tr><tr><th style="background:#fff;font-size:7px">PRODUCTO \\ FECHA</th>${ddate}</tr>
      ${e.products.filter(p => trim(p.name) || p.values.some(v => num(v))).map(p => `<tr><td class="p">${esc(p.name)}${trim(p.nota) ? ` <span class="muted">(${esc(p.nota)})</span>` : ""}</td>${Array.from({ length:nd }, (_, d) => `<td class="${fer[d] ? "f" : ""}">${fmtN(num(p.values[d]))}</td>`).join("")}</tr>`).join("")}
      <tr class="t"><td class="p" style="text-align:right"><u>Totales:</u></td>${t.map((x, d) => `<td class="${fer[d] ? "f" : ""}">${fmtN(x)}</td>`).join("")}</tr></table>`;
  };
  const agg = prodAgg(C), tot = Array(nd).fill(0); agg.forEach(a => a.t.forEach((x, i) => tot[i] += x));
  let h = `<div class="ps"><div class="top"><img src="${LOGO_SRC}" alt=""><div class="ctitle" style="flex:1;margin:0"><b>CUADRO CUPOS ROSARIO</b><span>SEMANA ${semanaNro(C.weekStart)}</span><span style="background:#C2F1C8">${fmtD(C.weekStart)} al ${fmtD(addDays(C.weekStart, nd - 1))}</span></div></div>
    <div class="cg">${main.map(block).join("")}
    <table class="cb"><tr><th class="n">FECHAS</th>${dhead}</tr><tr><th style="background:#215F9A;color:#fff;font-size:7px">CAMIONES X PRODUCTOS</th>${Array.from({ length:nd }, (_, d) => `<th class="${fer[d] ? "f" : ""}" style="${fer[d] ? "" : "background:#215F9A;color:#fff"}">${fmtDs(addDays(C.weekStart, d))}</th>`).join("")}</tr>
      ${agg.map(a => `<tr><td class="p" style="font-weight:700;color:${prodColor(a.label) || "#000"}">${esc(a.label)}</td>${a.t.map((x, d) => `<td class="${fer[d] ? "f" : ""}" style="font-weight:700">${fmtN(x)}</td>`).join("")}</tr>`).join("")}
      <tr class="t"><td class="p" style="background:#156082;color:#fff">TOTALES</td>${tot.map((x, d) => `<td class="${fer[d] ? "f" : ""}" style="${fer[d] ? "" : "background:#156082;color:#fff"}">${fmtN(x)}</td>`).join("")}</tr></table></div>`;
  if (ap.length) h += `<div class="rsec">Aparte</div><div class="cg">${ap.map(block).join("")}</div>`;
  return h + `</div>`;
}
function psResumen(B, C, V){
  let h = `<div class="ps"><div class="top"><img src="${LOGO_SRC}" alt=""><div class="ttl">RESUMEN DIARIO · SPSA ROSARIO</div><div class="dt">${fechaLarga(B.date)}</div></div>`;
  h += `<div class="rsec">Posición de buques</div>`;
  let any = false;
  B.units.forEach(u => {
    const vs = visVessels(u); if (!vs.length && !trim(u.note)) return; any = true;
    h += `<div style="font-weight:800;margin:6px 0 3px">${esc(u.name)}${trim(u.note) ? ` <span class="muted" style="font-weight:600">· ${esc(u.note)}</span>` : ""}</div>`;
    if (!vs.length) return;
    h += `<table class="rt"><tr><th>Buque</th><th>Estado</th><th>Cargador/es</th><th>Mercadería</th><th>Plano / declaración</th><th>Destino</th><th>Agencia</th><th>Bodegas</th></tr>`;
    vs.forEach(v => {
      const hs = v.holds.map((x, i) => trim(x) ? `#${i + 1} ${esc(x)}` : "").filter(Boolean).join(" · ");
      h += `<tr><td><b>${esc(v.buque)}</b></td><td${esOperando(v.estado) ? ' style="color:#375623;font-weight:700"' : ""}>${esc(v.estado)}</td><td>${lines(v.cargadores).map(esc).join(", ")}</td>
        <td>${lines(v.mercaderia).map(m => `<b style="color:${prodColor(m) || "#000"}">${esc(m)}</b>`).join(", ")}</td><td>${esc(trim(v.planoCarga) || v.declaracion)}</td><td>${esc(v.destino)}</td><td>${lines(v.agencia).map(esc).join(", ")}</td><td>${hs || '<span class="muted">—</span>'}</td></tr>`;
    });
    h += `</table>`;
  });
  if (!any) h += `<div class="muted">Sin buques cargados.</div>`;
  // Cupos desde el día del resumen hasta el fin de la semana
  const nd = nDays(C);
  let from = Math.round((dOf(B.date) - dOf(C.weekStart)) / 86400000); if (from < 0 || from >= nd) from = 0;
  const idx = Array.from({ length:nd - from }, (_, i) => i + from);
  h += `<div class="rsec">Cupos del ${fmtD(addDays(C.weekStart, from))} al ${fmtD(addDays(C.weekStart, nd - 1))}</div>`;
  const agg = prodAgg(C), exps = expActive(C).filter(e => !e.aparte && trim(e.name));
  if (!agg.length) h += `<div class="muted">Sin cupos cargados para esa semana.</div>`;
  else {
    const th = idx.map(i => `<th style="text-align:right">${DIAS_C[i]} ${fmtDs(addDays(C.weekStart, i))}${C.feriados[i] ? " (fer.)" : ""}</th>`).join("");
    const row = (l, t, b) => `<tr><td>${b ? "<b>" + esc(l) + "</b>" : esc(l)}</td>${idx.map(i => `<td style="text-align:right">${fmtN(t[i])}</td>`).join("")}<td style="text-align:right"><b>${fmtN(idx.reduce((s, i) => s + t[i], 0))}</b></td></tr>`;
    const tot = Array(nd).fill(0); agg.forEach(a => a.t.forEach((x, i) => tot[i] += x));
    h += `<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><table class="rt"><tr><th>Exportador</th>${th}<th style="text-align:right">Total</th></tr>${exps.map(e => row(e.name, expTotals(e, nd))).join("")}${row("Cupos por día", tot, true)}</table>
      <table class="rt"><tr><th>Producto</th>${th}<th style="text-align:right">Total</th></tr>${agg.map(a => row(a.label, a.t)).join("")}${row("Totales", tot, true)}</table></div>`;
  }
  h += `<div class="rsec">Posición de vagones</div>`;
  const rows = V.rows.filter(r => WAGON_COLS.some(c => trim(r[c.key])));
  if (!rows.length) h += `<div class="muted">Sin vagones cargados.</div>`;
  else {
    const cols = WAGON_COLS.filter(c => ["ffcc","operativo","cantVagones","producto","destinatario","toneladas","remitente","situacion","observaciones"].includes(c.key));
    h += `<table class="rt"><tr>${cols.map(c => `<th>${esc(c.label)}</th>`).join("")}</tr>${rows.map(r => `<tr>${cols.map(c => `<td>${esc(r[c.key])}</td>`).join("")}</tr>`).join("")}
      <tr><td colspan="${cols.findIndex(c => c.key === "toneladas")}" style="text-align:right"><b>Total toneladas</b></td><td><b>${fmtN(rows.reduce((s, r) => s + num(r.toneladas), 0))}</b></td><td colspan="${cols.length - 1 - cols.findIndex(c => c.key === "toneladas")}"></td></tr></table>`;
  }
  return h + `</div>`;
}
const resumenCupos = () => S.resumenCupos || S.cupos;
function sheetFor(sec){
  if (sec === "buques") return { html:psBuques(S.buques), land:true, name:"Posición de buques " + fmtD(S.date) };
  if (sec === "vagones") return { html:psVagones(S.vagones), land:true, name:"Posición de vagones " + fmtD(S.date) };
  if (sec === "cupos") return { html:psCupos(S.cupos), land:false, name:"Cuadro de cupos semana " + semanaNro(S.week) };
  return { html:psResumen(S.buques, resumenCupos(), S.vagones), land:false, name:"Resumen " + fmtD(S.date) };
}
function openPreview(){
  const sh = sheetFor(S.sec);
  const m = document.createElement("div");
  m.className = "preview"; m.id = "preview";
  m.innerHTML = `<div class="pbar"><b>${esc(sh.name)}</b>
      <button class="btn" type="button" data-act="closePrev">Cerrar</button>
      <button class="btn primary" type="button" data-act="doPrint">${svg("down2")}Guardar PDF / imprimir</button></div>
    <div class="pscroll"><div class="ppaper${sh.land ? "" : " portrait"}">${sh.html}</div></div>`;
  document.body.appendChild(m);
  m.querySelector("[data-act=doPrint]").focus();
}
function doPrint(){
  const sh = sheetFor(S.sec);
  $("printSheet").innerHTML = sh.html;
  let st = $("pageStyle"); if (!st){ st = document.createElement("style"); st.id = "pageStyle"; document.head.appendChild(st); }
  st.textContent = `@media print{@page{size:A4 ${sh.land ? "landscape" : "portrait"};margin:8mm}}`;
  const old = document.title; document.title = sh.name;
  setTimeout(() => { window.print(); document.title = old; }, 60);
}

const XL = {
  col(n){ let s = ""; while (n > 0){ const r = (n - 1) % 26; s = String.fromCharCode(65 + r) + s; n = Math.floor((n - 1) / 26); } return s; },
  fill: argb => ({ type:"pattern", pattern:"solid", fgColor:{ argb:"FF" + argb.replace("#", "") } }),
  thin: { style:"thin" }, med: { style:"medium" },
  box(ws, r1, c1, r2, c2, side = { style:"thin" }){
    for (let r = r1; r <= r2; r++) for (let c = c1; c <= c2; c++){
      const cell = ws.getCell(r, c), b = Object.assign({}, cell.border);
      if (r === r1) b.top = side; if (r === r2) b.bottom = side; if (c === c1) b.left = side; if (c === c2) b.right = side;
      cell.border = b;
    }
  },
  grid(ws, r1, c1, r2, c2){ for (let r = r1; r <= r2; r++) for (let c = c1; c <= c2; c++) ws.getCell(r, c).border = { top:XL.thin, left:XL.thin, bottom:XL.thin, right:XL.thin }; },
  put(ws, r, c, v, st = {}){
    const cell = ws.getCell(r, c);
    if (v !== undefined) cell.value = v;
    if (st.font) cell.font = st.font;
    if (st.fill) cell.fill = XL.fill(st.fill);
    if (st.al) cell.alignment = st.al;
    if (st.fmt) cell.numFmt = st.fmt;
    return cell;
  },
  merge(ws, r1, c1, r2, c2, v, st){ if (r1 !== r2 || c1 !== c2) ws.mergeCells(r1, c1, r2, c2); XL.put(ws, r1, c1, v, st); XL.box(ws, r1, c1, r2, c2); },
  numOrText(v){ const s = trim(v); if (!s) return null; return /^-?\d+([.,]\d+)?$/.test(s) ? num(s) : s; },
  dateVal: iso => { const [y, m, d] = iso.split("-").map(Number); return new Date(Date.UTC(y, m - 1, d)); },
};
const C_CENTER = { horizontal:"center", vertical:"middle", wrapText:true };
const PROD_FILL = { TRIGO:"C2F1C8", MAIZ:"FFFF00", SORGO:"FBE3D6", SOJA:"FFFFCC", GIRASOL:"FFE699", CEBADA:"EDE2D5" };
const prodFont = (s, base) => { const c = prodColor(s); return c ? Object.assign({}, base, { color:{ argb:"FF" + c.slice(1) } }) : base; };

function posiBlock(ws, r, v, F14, F16, FRAME, frameRow){

  XL.merge(ws, hr, 3, hr, 5, "Buque", H);

  XL.merge(ws, hr, 8, hr, 8, v.tipo || "Exportación", Object.assign({}, H, { fill:"E2F0D9" }));
  [[10, "Plano de carga"], [12, "Observaciones"], [14, "Cargador/es"], [16, "Declaración"], [18, "Mercadería"], [20, "Surveyor"], [22, "Agencia"], [24, "Destino"]].forEach(([c, t]) => XL.merge(ws, hr, c, hr, c, t, H));

  XL.merge(ws, d4, 26, d5, 27, "COORDINA: " + trim(v.coordina), O);
  const FT = { font:F16, al:{ horizontal:"center", vertical:"middle" } };
  ["Eslora", "Manga", "Puntal"].forEach((t, i) => XL.merge(ws, fr, 3 + i, fr, 3 + i, t, FT));
  XL.merge(ws, fr, 7, fr, 8, "Procedencia: " + trim(v.procedencia), FT);
  [10, 12, 14, 16, 18, 20, 22].forEach((c, i) => XL.merge(ws, fr, c, fr, c, `# ${i + 1} - ${trim(v.holds[i])}`, FT));
  XL.merge(ws, fr, 24, fr, 24, null, FT); XL.merge(ws, fr, 26, fr, 27, null, FT);
  frameRow(fr + 1, 7.5);
  return fr + 2;
}

  XL.put(ws, 4, 6, XL.dateVal(todayISO()), { font:B12, fill:"C2F1C8", al:{ horizontal:"center" }, fmt:"dd/mm/yyyy" });
  let r = 6; sep(r, 5.25); r++;
  const blockRows = []; // filas de productos (para el resumen)

    for (let d = 0; d < nd; d++){

      XL.put(ws, h + 1, D0 + d, XL.dateVal(addDays(C.weekStart, d)), { font:B12, fill:f, al:{ horizontal:"center", vertical:"middle" }, fmt:"dd/mm" });
    }
    const ps = e.products.filter(p => trim(p.name) || p.values.some(v => num(v)));
    r = h + 2;
    const p1 = r;
    (ps.length ? ps : [newProduct()]).forEach(p => {
      ws.getRow(r).height = 16.5;
      XL.put(ws, r, 3, trim(p.name), { font:A12, al:C_CENTER });
      for (let d = 0; d < nd; d++) XL.put(ws, r, D0 + d, num(p.values[d]), { font:A12, al:{ horizontal:"center", vertical:"middle" }, fill:fer[d] ? FER : undefined });
      if (trim(p.nota)) XL.put(ws, r, NOTE, trim(p.nota), { font:A12 });
      if (!e.aparte) blockRows.push({ r, key:prodKey(p.name) });
      r++;
    });
    ws.getRow(r).height = 16.5;

    }
    XL.grid(ws, h, 3, r, DL); XL.box(ws, h, 3, r, DL, XL.med); XL.box(ws, r, 3, r, DL, XL.med);

    r++;
    sep(r, 5.25, frame); r++;
  };
  const act = expActive(C);
  act.filter(e => !e.aparte).forEach(e => block(e, true));
  // Resumen CAMIONES X PRODUCTOS

  const sh = r;
  ws.getRow(sh).height = 16.5; ws.getRow(sh + 1).height = 24;

  }
  r = sh + 2;

    ws.getRow(r).height = 18.75;

    const refs = blockRows.filter(x => x.key === a.label).map(x => x.r);
    for (let d = 0; d < nd; d++){
      const col = XL.col(D0 + d);
      const f = refs.length ? `SUM(${refs.map(x => col + x).join(",")})` : "0";
      XL.put(ws, r, D0 + d, { formula:f, result:a.t[d] }, { font:B12, fill:fer[d] ? FER : fl, al:{ horizontal:"center", vertical:"middle" } });
    }
    r++;
  });
  ws.getRow(r).height = 22.5;
  XL.put(ws, r, 3, "TOTALES", { font:Object.assign({}, B12, { color:{ argb:"FFFFFFFF" } }), fill:"156082", al:C_CENTER });
  for (let d = 0; d < nd; d++){
    const col = XL.col(D0 + d), tot = agg.reduce((s, a) => s + a.t[d], 0);
    XL.put(ws, r, D0 + d, { formula:agg.length ? `SUM(${col}${s1}:${col}${r - 1})` : "0", result:tot }, { font:Object.assign({}, B12, fer[d] ? {} : { color:{ argb:"FFFFFFFF" } }), fill:fer[d] ? FER : "156082", al:{ horizontal:"center", vertical:"middle" } });
  }
  XL.grid(ws, sh, 3, r, DL); XL.box(ws, sh, 3, r, DL, XL.med); XL.box(ws, r, 3, r, DL, XL.med);
  for (let rr = sh; rr <= r; rr++){ XL.put(ws, rr, 2, undefined, { fill:BLUE }); XL.put(ws, rr, FR, undefined, { fill:BLUE }); }
  r++; sep(r, 8.25); r++;
  const ap = act.filter(e => e.aparte);
  if (ap.length){ r += 6; ap.forEach(e => block(e, false)); }
  ws.pageSetup = { paperSize:9, orientation:"portrait", fitToPage:true, fitToWidth:1, fitToHeight:0, horizontalCentered:true, margins:{ left:0.3, right:0.3, top:0.3, bottom:0.3, header:0.2, footer:0.2 } };
  ws.pageSetup.printArea = `A1:${XL.col(NOTE)}${r}`;
  return ws;
}

async function downloadWB(wb, filename){
  const buf = await wb.xlsx.writeBuffer();
  const blob = new Blob([buf], { type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

      fname = `POSIS ${dd}.xlsx`;
    }
    await downloadWB(wb, fname);
    toast("Excel descargado: " + fname);
  }catch(e){ console.error(e); toast("No se pudo armar el Excel: " + (e.message || e)); }
