/* =================== VENTANAS =================== */
function modal(title, body, buttons){
  return new Promise(res => {
    const m = document.createElement("div");
    m.className = "modal";
    m.innerHTML = `<div class="mbox" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h2>${esc(title)}</h2><form>${body}<div class="mbtns">${buttons.map((b, i) => `<button class="btn${b.primary ? " primary" : ""}" type="${b.primary ? "submit" : "button"}" data-i="${i}">${esc(b.label)}</button>`).join("")}</div></form></div>`;
    document.body.appendChild(m);
    const form = m.querySelector("form");
    const done = v => { m.remove(); document.removeEventListener("keydown", esc_); res(v); };
    const esc_ = e => { if (e.key === "Escape") done(null); };
    document.addEventListener("keydown", esc_);
    const data = () => Object.fromEntries(new FormData(form).entries());
    form.addEventListener("submit", e => { e.preventDefault(); const i = buttons.findIndex(b => b.primary); done({ v:buttons[i].value, f:data() }); });
    m.querySelectorAll("button[type=button]").forEach(b => b.addEventListener("click", () => { const x = buttons[+b.dataset.i]; done(x.value == null ? null : { v:x.value, f:data() }); }));
    m.addEventListener("click", e => { if (e.target === m) done(null); });
    (m.querySelector("button.primary") || m.querySelector("button")).focus();
  });
}

/* =================== LEER LOS EXCEL =================== */
function wsTools(ws){
  const R = ws["!ref"] ? XLSX.utils.decode_range(ws["!ref"]) : { s:{ r:0, c:0 }, e:{ r:-1, c:-1 } };
  const cell = (r, c) => ws[XLSX.utils.encode_cell({ r, c })];
  const v = (r, c) => { const x = cell(r, c); return x ? x.v : ""; };
  const t = (r, c) => { const x = cell(r, c); if (!x || x.v == null) return ""; return String(x.t === "n" && x.w ? x.w : x.v).replace(/\s+/g, " ").trim(); };
  const hidden = r => !!(ws["!rows"] && ws["!rows"][r] && ws["!rows"][r].hidden);
  const dateAt = (r, c) => { const x = cell(r, c); if (!x || x.t !== "n" || x.v < 30000 || x.v > 70000) return null; const p = XLSX.SSF.parse_date_code(x.v); return p ? `${p.y}-${pad(p.m)}-${pad(p.d)}` : null; };
  const fillOf = (r, c) => { const x = cell(r, c); return x && x.s && x.s.fgColor && x.s.fgColor.rgb ? String(x.s.fgColor.rgb).toUpperCase().slice(-6) : ""; };
  return { R, cell, v, t, hidden, dateAt, fillOf };
}
function detectKind(wb){
  if (wb.SheetNames.some(n => /^SEM\s*\d+/i.test(n.trim()))) return "cupos";
  for (const name of wb.SheetNames){
    const T = wsTools(wb.Sheets[name]);
    for (let r = 0; r <= Math.min(T.R.e.r, 60); r++) for (let c = 0; c <= Math.min(T.R.e.c, 30); c++){
      const s = nrm(T.t(r, c));
      if (s.includes("CUADRO CUPOS")) return "cupos";
      if (s.includes("POSICION DE VAGONES") || s === "FF.CC") return "vagones";
      if (s.includes("POSICION DE BUQUES") || (s === "BUQUE" && c === 2)) return "buques";
    }
  }
  return null;
}
function parsePosibuque(wb){
  const order = ["Hoja1", ...wb.SheetNames.filter(n => n !== "Hoja1" && !/PLANTILLA|LISTAS/i.test(n))];
  for (const name of order){
    if (!wb.Sheets[name]) continue;
    const T = wsTools(wb.Sheets[name]);
    const C = { buque:2, estado:6, tipo:7, plano:9, obs:11, carg:13, decl:15, merc:17, surv:19, ag:21, dest:23, obs2:25, obs2b:26 };
    let date = null; const units = []; let unit = null;
    for (let r = 0; r <= Math.min(T.R.e.r, 5) && !date; r++) for (let c = 0; c <= T.R.e.c; c++){ const d = T.dateAt(r, c); if (d){ date = d; break; } }
    for (let r = T.R.s.r; r <= T.R.e.r; r++){
      const cv = nrm(T.t(r, C.buque));
      if (/^UNIDAD\s*\S+/.test(cv)){ unit = newUnit(T.t(r, C.buque)); unit.note = T.t(r, C.plano); units.push(unit); continue; }
      if (cv !== "BUQUE") continue;
      let f = r + 1;
      while (f <= T.R.e.r && nrm(T.t(f, C.buque)) !== "ESLORA" && nrm(T.t(f, C.buque)) !== "BUQUE") f++;
      const rows = []; for (let k = r + 1; k < f; k++) rows.push(k);
      const list = c => [...new Set(rows.map(k => T.t(k, c)).filter(Boolean))];
      const v = newVessel();
      const tipo = nrm(T.t(r, C.tipo)); if (tipo.startsWith("IMPORT")) v.tipo = "Importación";
      const textC = rows.map(k => T.cell(k, C.buque)).find(x => x && x.t === "s" && trim(x.v));
      v.buque = textC ? trim(textC.v).toUpperCase() : "";
      const dimRow = [...rows].reverse().find(k => [0, 1, 2].some(i => { const x = T.cell(k, C.buque + i); return x && x.t === "n"; }));
      if (dimRow != null) [v.eslora, v.manga, v.puntal] = [0, 1, 2].map(i => { const x = T.cell(dimRow, C.buque + i); return x && x.t === "n" ? String(x.v) : ""; });
      v.estado = list(C.estado).join(" ");
      v.planoCarga = list(C.plano).join(" ");
      v.observaciones1 = list(C.obs).join("\n");
      v.cargadores = list(C.carg).join("\n");
      v.declaracion = list(C.decl).join(" ");
      v.mercaderia = list(C.merc).join("\n");
      v.surveyor = list(C.surv).join("\n");
      v.agencia = list(C.ag).join("\n");
      v.destino = list(C.dest).join(" - ");
      const o2 = rows.map(k => trim(T.t(k, C.obs2) + " " + T.t(k, C.obs2b))).filter(Boolean);
      const pick = p => (o2.find(o => nrm(o).startsWith(p)) || "").replace(/^[^:]*:\s*/, "").trim();
      v.draft = pick("DRAFT"); v.fumiga = pick("FUMIGA"); v.coordina = pick("COORDINA");
      if (f <= T.R.e.r && nrm(T.t(f, C.buque)) === "ESLORA"){
        v.procedencia = T.t(f, C.estado).replace(/^procedencia:?\s*/i, "");
        [C.plano, C.obs, C.carg, C.decl, C.merc, C.surv, C.ag].forEach((c, i) => { const m = T.t(f, c).match(/^#\s*\d+\s*-\s*(.*)$/); v.holds[i] = m ? m[1].trim() : ""; });
      }
      v.oculto = T.hidden(r) && rows.every(k => T.hidden(k));
      if (!unit){ unit = newUnit("UNIDAD 7"); units.push(unit); }
      if (!isEmptyVessel(v)) unit.vessels.push(v);
      r = f;
    }
    if (units.length) return { date, units };
  }
  return null;
}
const VAG_MAP = [["FF.CC","ffcc"],["FFCC","ffcc"],["OPERATIVO","operativo"],["DESTINATARIO","destinatario"],["DESTINO","destino"],["CANT","cantVagones"],["ENTREGADOR","entregador"],["PRODUCTO","producto"],["TONELADA","toneladas"],["REMITENTE","remitente"],["PROCEDENCIA","procedencia"],["SITUACION","situacion"],["UBICACION","observaciones"],["OBSERVAC","observaciones"]];
function parsePosivagones(wb){
  for (const name of wb.SheetNames){
    const T = wsTools(wb.Sheets[name]);
    let hr = -1;
    for (let r = 0; r <= Math.min(T.R.e.r, 40) && hr < 0; r++) for (let c = 0; c <= T.R.e.c; c++) if (nrm(T.t(r, c)) === "FF.CC" || nrm(T.t(r, c)) === "FFCC"){ hr = r; break; }
    if (hr < 0) continue;
    const cols = {};
    for (let c = 0; c <= T.R.e.c; c++){ const h = nrm(T.t(hr, c)); if (!h) continue; const m = VAG_MAP.find(([k]) => h.startsWith(k)); if (m && cols[m[1]] == null) cols[m[1]] = c; }
    let date = null;
    for (let r = 0; r < hr && !date; r++) for (let c = 0; c <= T.R.e.c; c++){ const d = T.dateAt(r, c); if (d){ date = d; break; } }
    const rows = []; let blanks = 0;
    for (let r = hr + 1; r <= T.R.e.r; r++){
      const all = Object.keys(cols).map(k => T.t(r, cols[k])).join(" ");
      if (/TOTAL\s*TONS/i.test(all)) break;
      const row = newWagon(); let any = false;
      for (const k in cols){ const x = T.cell(r, cols[k]); const val = x && x.v != null ? String(x.t === "n" && k !== "toneladas" && k !== "cantVagones" ? (x.w || x.v) : x.v).trim() : ""; row[k] = val; if (val) any = true; }
      if (!any){ if (++blanks >= 3) break; continue; }
      blanks = 0; rows.push(row);
    }
    return { date, rows };
  }
  return null;
}
const DAY_IDX = { LUNES:0, MARTES:1, MIERCOLES:2, JUEVES:3, VIERNES:4, SABADO:5, DOMINGO:6 };
function cuposSheets(wb){
  return wb.SheetNames.filter(n => /^SEM/i.test(n.trim()) || wb.SheetNames.length === 1).map(n => {
    const T = wsTools(wb.Sheets[n]); let week = null;
    for (let r = 0; r <= Math.min(T.R.e.r, 30) && !week; r++){
      if (DAY_IDX[nrm(T.t(r, 3))] !== 0) continue;
      const d = T.dateAt(r + 1, 3); if (d) week = mondayOf(d);
    }
    return { name:n, week };
  });
}
function parseCupos(wb, sheet){
  const T = wsTools(wb.Sheets[sheet]);
  let week = null, afterSummary = false, ferDone = false;
  const exps = [], feriados = Array(7).fill(false); let domingo = false;
  for (let r = T.R.s.r; r <= T.R.e.r; r++){
    const name = T.t(r, 2);
    const dayCols = [];
    for (let c = 3; c <= Math.min(T.R.e.c, 12); c++){ const k = DAY_IDX[nrm(T.t(r, c))]; if (k != null) dayCols.push({ c, k }); }
    if (!name || dayCols.length < 4) continue;
    if (nrm(name) === "FECHAS"){ afterSummary = true; continue; }
    const dr = r + 1;
    if (!week){ const d = dayCols.map(x => T.dateAt(dr, x.c)).find(Boolean); if (d) week = mondayOf(d); }
    const map = dayCols.map(x => { const d = T.dateAt(dr, x.c); let k = x.k; if (d && week){ const diff = Math.round((dOf(d) - dOf(week)) / 86400000); k = diff >= 0 && diff <= 6 ? diff : -1; } return { c:x.c, k }; }).filter(x => x.k >= 0);
    const e = newExp(name); e.products = []; e.aparte = afterSummary; e.inactivo = T.hidden(r);
    if (!ferDone && !e.inactivo){ dayCols.forEach(x => { if (T.fillOf(r, x.c) === "FFC000") feriados[x.k] = true; }); ferDone = true; }
    const lastC = Math.max(...dayCols.map(x => x.c));
    let k = dr + 1;
    for (; k <= T.R.e.r; k++){
      const pn = T.t(k, 2);
      if (/^TOTALES/i.test(nrm(pn))) break;
      if (DAY_IDX[nrm(T.t(k, 3))] != null) { k--; break; }
      if (!pn && map.every(x => !num(T.v(k, x.c)))) continue;
      if (T.hidden(k) && !e.inactivo && map.every(x => !num(T.v(k, x.c)))) continue;
      const p = newProduct(trim(pn));
      map.forEach(x => { const n = num(T.v(k, x.c)); p.values[x.k] = n ? String(n) : ""; if (x.k === 6 && n) domingo = true; });
      const notes = []; for (let c = lastC + 1; c <= Math.min(T.R.e.c, lastC + 6); c++){ const s = T.cell(k, c); if (s && s.t === "s" && trim(s.v)) notes.push(trim(s.v)); }
      p.nota = notes.join(" ");
      e.products.push(p);
    }
    if (!e.products.length) e.products.push(newProduct());
    exps.push(e);
    r = k;
  }
  return { week, exportadores:exps, feriados, domingo };
}

/* =================== IMPORTAR =================== */
async function importFile(file){
  if (!file) return;
  try{
    setStatus("Leyendo Excel…", "busy");
    await needXLSX();
    const wb = XLSX.read(await file.arrayBuffer(), { type:"array", cellStyles:true });
    const kind = detectKind(wb);
    setStatus("Al día", "ok");
    if (kind === "buques") return importBuques(wb, file.name);
    if (kind === "vagones") return importVagones(wb, file.name);
    if (kind === "cupos") return importCupos(wb, file.name);
    toast("No reconocí el archivo. Tiene que ser la POSIBUQUE, la POSIVAGONES o el CUADRO CUPOS.", 5000);
  }catch(e){ console.error(e); setStatus("Al día", "ok"); toast("No se pudo leer el Excel: " + (e.message || e), 5000); }
}
function dateChoice(fileDate){
  if (!fileDate || fileDate === S.date) return `<input type="hidden" name="d" value="${S.date}">`;
  return `<div class="opts">
    <label class="opt"><input type="radio" name="d" value="${S.date}" checked><span><b>En la fecha que tenés abierta (${fmtD(S.date)})</b><small>Lo más común: cargar la planilla de hoy.</small></span></label>
    <label class="opt"><input type="radio" name="d" value="${fileDate}"><span><b>En la fecha de la planilla (${fmtD(fileDate)})</b><small>La fecha que figura arriba en el Excel.</small></span></label></div>`;
}
async function hasData(key){ const o = await loadJSON(key); if (!o) return false; if (o.units) return o.units.some(u => (u.vessels || []).some(v => trim(v.buque))); if (o.rows) return o.rows.some(r => WAGON_COLS.some(c => trim(r[c.key]))); if (o.exportadores) return o.exportadores.some(e => trim(e.name)); return false; }
async function importBuques(wb, fname){
  const x = parsePosibuque(wb);
  if (!x || !x.units.some(u => u.vessels.length)) return toast("No encontré buques en " + fname, 5000);
  const resumen = x.units.map(u => `${esc(u.name)}: ${u.vessels.filter(v => !v.oculto).map(v => esc(v.buque)).join(", ") || "sin buques"}`).join("<br>");
  const ocultos = x.units.reduce((n, u) => n + u.vessels.filter(v => v.oculto).length, 0);
  const r = await modal("Cargar la POSIBUQUE", `<p>${resumen}${ocultos ? `<br><small>Además hay ${ocultos} buque(s) oculto(s) que se cargan ocultos.</small>` : ""}</p>${dateChoice(x.date)}<p><small>Reemplaza lo que haya cargado en Buques para esa fecha.</small></p>`, [{ label:"Cancelar" }, { label:"Cargar", primary:true, value:"ok" }]);
  if (!r) return;
  await applyImport("buques", r.f.d, { units:x.units });
}
async function importVagones(wb, fname){
  const x = parsePosivagones(wb);
  if (!x || !x.rows.length) return toast("No encontré vagones en " + fname, 5000);
  const tons = x.rows.reduce((s, r) => s + num(r.toneladas), 0);
  const r = await modal("Cargar la POSIVAGONES", `<p>${x.rows.length} fila(s) · ${fmtN(tons)} toneladas.</p>${dateChoice(x.date)}<p><small>Reemplaza lo que haya cargado en Vagones para esa fecha.</small></p>`, [{ label:"Cancelar" }, { label:"Cargar", primary:true, value:"ok" }]);
  if (!r) return;
  await applyImport("vagones", r.f.d, { rows:x.rows });
}
async function importCupos(wb, fname){
  const sheets = cuposSheets(wb).filter(s => s.week);
  if (!sheets.length) return toast("No encontré semanas en " + fname, 5000);
  const def = sheets.find(s => s.week === S.week) || sheets[sheets.length - 1];
  const r = await modal("Cargar el CUADRO CUPOS", `<p>El archivo tiene ${sheets.length} semana(s). Elegí cuál cargar:</p>
    <label class="fl" style="margin-bottom:12px"><span>Hoja</span><select class="in" name="s">${sheets.slice().reverse().map(s => `<option value="${esc(s.name)}"${s === def ? " selected" : ""}>${esc(s.name.trim())} · ${fmtD(s.week)} al ${fmtD(addDays(s.week, 5))}</option>`).join("")}</select></label>
    <p><small>Se carga en esa semana y reemplaza lo que haya. Los exportadores ocultos en el Excel quedan en pausa y los que están debajo del resumen (como PTO ARROYO) quedan aparte.</small></p>`, [{ label:"Cancelar" }, { label:"Cargar", primary:true, value:"ok" }]);
  if (!r) return;
  const x = parseCupos(wb, r.f.s);
  if (!x.week) return toast("No pude leer las fechas de esa hoja.", 5000);
  await applyImport("cupos", x.week, { exportadores:x.exportadores, feriados:x.feriados, domingo:x.domingo });
}
async function applyImport(t, when, data){
  await flush();
  if (t === "cupos"){
    if (when !== S.week){ await loadWeek(when); }
    S.cupos = fixCupos(data, when);
  } else {
    if (when !== S.date){ await loadDay(when); if (S.sec === "resumen") await ensureResumenCupos(); }
    if (t === "buques") S.buques = fixBuques(data, when); else S.vagones = fixVagones(data, when);
  }
  pending.add(t); await flush();
  S.sec = t; local.set("sec", t);
  try{ history.replaceState(null, "", "#" + t); }catch(e){}
  render();
  toast("Listo, quedó cargado y guardado para todo el equipo.");
}

/* =================== COPIAR ANTERIOR / NUEVA SEMANA =================== */
async function copyPrev(){
  const t = S.sec, key = t === "buques" ? keyB : keyV;
  let prev = null, from = null;
  for (let i = 1; i <= 10 && !prev; i++){ const d = addDays(S.date, -i); const o = await loadJSON(key(d)); if (o && ((o.units && o.units.some(u => (u.vessels || []).length)) || (o.rows && o.rows.length))){ prev = o; from = d; } }
  if (!prev) return toast("No encontré datos en los 10 días anteriores.", 4000);
  const cur = t === "buques" ? S.buques.units.some(u => u.vessels.length) : S.vagones.rows.length;
  if (cur && !confirm(`Se va a reemplazar lo cargado el ${fmtD(S.date)} con lo del ${fmtD(from)}. ¿Seguir?`)) return;
  if (t === "buques") S.buques = fixBuques({ units:prev.units.map(u => ({ ...u, id:uid(), vessels:(u.vessels || []).map(v => ({ ...v, id:uid() })) })) }, S.date);
  else S.vagones = fixVagones({ rows:prev.rows.map(r => ({ ...r, id:uid() })) }, S.date);
  scheduleSave(t); rerender();
  toast(`Copiado del ${WEEKDAY[dOf(from).getDay()]} ${fmtD(from)}. Ahora actualizá lo que cambió.`);
}
async function newWeek(){
  const pw = addDays(S.week, -7);

  if (!prev || !(prev.exportadores || []).length) return toast("La semana anterior no tiene cupos cargados.", 4000);

    <div class="opts"><label class="opt"><input type="radio" name="m" value="nums" checked><span><b>Sí, mismos números</b><small>Después corregís lo que cambió.</small></span></label>
    <label class="opt"><input type="radio" name="m" value="zero"><span><b>No, todo en 0</b><small>Solo la lista de exportadores y productos.</small></span></label></div>
    ${S.cupos.exportadores.length ? `<p><small>Reemplaza lo que ya hay cargado en esta semana.</small></p>` : ""}`, [{ label:"Cancelar" }, { label:"Copiar", primary:true, value:"ok" }]);
  if (!r) return;

/* =================== COPIA DE SEGURIDAD =================== */
async function backup(){
  try{
    setStatus("Armando copia…", "busy"); await flush();
    const out = {};
    for (const p of ["posibuque:", "posivagones:", "poscupos:", "config:"]){
      for (const k of await store.list(p)){ const v = await store.get(k); if (v) out[k] = v; }
    }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(out, null, 1)], { type:"application/json" }));
    a.download = `posicupos-copia-${todayISO()}.json`; document.body.appendChild(a); a.click(); a.remove();
    setStatus("Al día", "ok"); toast(`Copia descargada (${Object.keys(out).length} registros).`);
  }catch(e){ setStatus("Al día", "ok"); toast("No se pudo armar la copia: " + (e.message || e)); }
}
async function restore(file){
  if (!file) return;
  let data; try{ data = JSON.parse(await file.text()); }catch(e){ return toast("Ese archivo no es una copia de Posicupos."); }
  const keys = Object.keys(data).filter(k => /^(posibuque|posivagones|poscupos|config):/.test(k));
  if (!keys.length) return toast("Ese archivo no es una copia de Posicupos.");
  if (!confirm(`Se van a restaurar ${keys.length} registros y se pisa lo guardado en esas mismas fechas. ¿Seguir?`)) return;
  await flush();
  setStatus("Restaurando…", "busy");
  for (const k of keys) await store.set(k, data[k]);
  await loadDay(S.date); await loadWeek(S.week); S.listas = fixListas(await loadJSON(KEY_L));
  setStatus("Al día", "ok"); render(); toast("Copia restaurada.");
}

  doPrint(){ doPrint(); },
  theirs(el){ const t = el.dataset.t; if (!confirm("Se descartan tus cambios sin guardar en " + SECTIONS[t].name + ". ¿Seguir?")) return; pending.delete(t); applyRemote(t); },
  mine(el){ const t = el.dataset.t; if (!confirm("Se reemplazan los cambios de la otra persona en " + SECTIONS[t].name + " con los tuyos. ¿Seguir?")) return; queued[t] = null; flush(); },
  applyNow(el){ if (document.activeElement) document.activeElement.blur(); tryApply(el.dataset.t); },
});
document.addEventListener("click", e => {
  const g = e.target.closest("[data-go]"); if (g){ go(g.dataset.go); return; }
  const a = e.target.closest("[data-act]");
  if (a && !a.disabled && ACTIONS[a.dataset.act]){
    if (a.tagName !== "INPUT" && a.tagName !== "LABEL") e.preventDefault();
    ACTIONS[a.dataset.act](a, e); return;
  }
  if (!e.target.closest(".menuwrap")) closeMenu();
});
document.addEventListener("keydown", e => {
  const a = e.target.closest && e.target.closest('[role="button"][data-act]');
  if (a && (e.key === "Enter" || e.key === " ") && e.target === a){ e.preventDefault(); ACTIONS[a.dataset.act](a, e); }
  if (e.key === "Escape"){ closeMenu(); const p = $("preview"); if (p) p.remove(); }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s"){ e.preventDefault(); flush(); }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "p" && S.sec !== "listas"){ e.preventDefault(); doPrint(); }
});
$("page").addEventListener("input", onField);
$("page").addEventListener("change", e => { if (e.target.tagName === "SELECT") onField(e); });
$("page").addEventListener("submit", onListSubmit);
document.addEventListener("change", e => {
  if (e.target.id === "datePick" && e.target.value) setDate(e.target.value);
  if (e.target.id === "weekPick" && e.target.value) setWeek(e.target.value);
});
$("moreBtn").addEventListener("click", e => { e.stopPropagation(); $("moreMenu").hidden ? openMenu() : closeMenu(); });
$("xlsBtn").addEventListener("click", exportExcel);
$("pdfBtn").addEventListener("click", openPreview);
$("xlsIn").addEventListener("change", e => { importFile(e.target.files[0]); e.target.value = ""; });
$("bakIn").addEventListener("change", e => { restore(e.target.files[0]); e.target.value = ""; });
$("menuBtn").addEventListener("click", () => document.body.classList.add("open"));
$("scrim").addEventListener("click", () => document.body.classList.remove("open"));
$("collapse").addEventListener("click", () => { document.body.classList.toggle("mini"); local.set("mini", document.body.classList.contains("mini")); });
if (local.get("mini", false)) document.body.classList.add("mini");
const savedTheme = local.get("tema", null); if (savedTheme) document.documentElement.dataset.theme = savedTheme;
$("theme").addEventListener("click", () => {
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme = dark ? "light" : "dark"; local.set("tema", dark ? "light" : "dark");
});
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (SECTIONS[h] && h !== S.sec) go(h); });
// Si la pestaña estuvo abierta de un día para otro, al volver se pasa al día de hoy
let lastDay = todayISO();
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible" || !S.buques) return;
  const t = todayISO();
  if (t !== lastDay){ const wasToday = S.date === lastDay; lastDay = t; if (wasToday && !pending.size) setDate(t); }
});

/* =================== INGRESO =================== */
const toEmail = u => { u = u.trim().toLowerCase(); return u.includes("@") ? u : u + USER_DOMAIN; };
const toUser = e => (e || "").replace(USER_DOMAIN, "");
function authError(code){
  return ({ "auth/invalid-credential":"Usuario o contraseña incorrectos.", "auth/wrong-password":"Usuario o contraseña incorrectos.", "auth/user-not-found":"Usuario o contraseña incorrectos.",
    "auth/invalid-login-credentials":"Usuario o contraseña incorrectos.", "auth/invalid-email":"Usuario no válido.", "auth/missing-password":"Falta la contraseña.",
    "auth/user-disabled":"Este usuario está deshabilitado.", "auth/too-many-requests":"Demasiados intentos. Esperá unos minutos y probá de nuevo.",
    "auth/network-request-failed":"Sin conexión. Revisá internet y probá de nuevo." })[code] || "No se pudo ingresar (" + code + ").";
}
$("lform").addEventListener("submit", async e => {
  e.preventDefault();
  const u = $("luser").value.trim(); $("lmsg").textContent = "";
  if (!u.includes("@") && !/^[a-zA-Z0-9._-]+$/.test(u)) { $("lmsg").textContent = "El usuario solo puede tener letras, números, puntos y guiones."; return; }
  $("lbtn").disabled = true; $("lbtn").textContent = "Ingresando…";
  try{ await auth.signInWithEmailAndPassword(toEmail(u), $("lpass").value); }
  catch(err){ $("lmsg").textContent = authError(err.code); }
  finally{ $("lbtn").disabled = false; $("lbtn").textContent = "Ingresar"; }
});
$("logout").addEventListener("click", async () => {
  if (!confirm("¿Cerrar sesión?")) return;
  await flush(); await auth.signOut();
});

let started = false;
auth.onAuthStateChanged(async user => {
  if (!user){
    if (started){ location.reload(); return; }
    $("lwait").hidden = true; $("lform").hidden = false; $("login").hidden = false;
    setTimeout(() => $("luser").focus(), 50);
    return;
  }
  $("login").hidden = true;
  $("who").innerHTML = `<b>${esc(toUser(user.email))}</b>`; $("who").title = "Conectado como " + toUser(user.email);
  if (started) return;
  started = true;
  await init();
});

async function init(){
  setStatus("Cargando…", "busy");
  const h = location.hash.slice(1);
  S.sec = SECTIONS[h] ? h : local.get("sec", "buques");
  if (!SECTIONS[S.sec]) S.sec = "buques";
  try{
    const [l] = await Promise.all([loadJSON(KEY_L), loadDay(S.date), loadWeek(S.week)]);
    S.listas = fixListas(l);
    store.watch(KEY_L, v => { if (!v) return; try{ S.listas = fixListas(JSON.parse(v)); }catch(e){ return; } if (S.sec === "listas" && !isEditing()) rerender(); else renderDatalists(); });
    if (S.sec === "resumen") await ensureResumenCupos();
    setStatus("Al día", "ok");
  }catch(e){
    console.error(e);
    S.buques = S.buques || fixBuques(null, S.date); S.vagones = S.vagones || fixVagones(null, S.date); S.cupos = S.cupos || fixCupos(null, S.week); S.listas = S.listas || fixListas(null);
    setStatus("Sin conexión", "err");
    toast("No se pudieron traer los datos. Revisá la conexión y recargá la página.", 6000);
  }
  render();
}

</script>
</body>
</html>
